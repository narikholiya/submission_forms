<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form Management & Submission Portal</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <header class="portal-header">
      <div>
        <h1>Form Management</h1>
        <p>Public submissions & applications portal</p>
      </div>
      <div class="header-actions">
        <a href="http://localhost:8080/dashboard.html" class="badge-dash" target="_blank">
          📊 Admin Dashboard (Port 8080) ↗
        </a>
      </div>
    </header>

    <div id="result" class="status-alert" role="status"></div>

    <section>
      <div class="section-head">
        <h2>General Submission Form</h2>
        <button type="button" class="btn-secondary" id="fillSampleSubmission">Fill Sample Data</button>
      </div>
      <form id="submissionForm">
        <input name="form_type" value="general" type="hidden">
        <input name="source" value="website" type="hidden">

        <div class="grid-2">
          <div>
            <label>Full Name</label>
            <input name="name" id="sub_name" placeholder="John Doe">
          </div>
          <div>
            <label>Email *</label>
            <input name="email" id="sub_email" type="email" placeholder="john.doe@example.com" required>
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label>Phone</label>
            <input name="phone" id="sub_phone" placeholder="+1-555-123-4567">
          </div>
          <div>
            <label>Company</label>
            <input name="company" id="sub_company" placeholder="Acme Global Inc.">
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label>Location</label>
            <input name="location" id="sub_location" placeholder="San Francisco, CA">
          </div>
          <div>
            <label>Account Type</label>
            <input name="account_type" id="sub_account_type" placeholder="Enterprise / Business">
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label>Plan</label>
            <input name="plan" id="sub_plan" placeholder="Enterprise Pro">
          </div>
          <div>
            <label>Product</label>
            <input name="product" id="sub_product" placeholder="Cloud Suite">
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label>Subject</label>
            <input name="subject" id="sub_subject" placeholder="Product Inquiry / Migration">
          </div>
          <div>
            <label>Currency</label>
            <input name="currency" id="sub_currency" placeholder="USD">
          </div>
        </div>

        <div>
          <label>Message</label>
          <textarea name="message" id="sub_message" placeholder="Describe your request or requirements here..."></textarea>
        </div>

        <button type="submit">Submit Form</button>
      </form>
    </section>

    <section>
      <div class="section-head">
        <h2>Career Application Form</h2>
        <button type="button" class="btn-secondary" id="fillSampleCareer">Fill Sample Data</button>
      </div>
      <form id="careerForm" enctype="multipart/form-data">
        <div class="grid-2">
          <div>
            <label>Email *</label>
            <input name="email" id="career_email" type="email" placeholder="applicant@example.com" required>
          </div>
          <div>
            <label>Phone</label>
            <input name="phone" id="career_phone" placeholder="+1-555-987-6543">
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label>Position *</label>
            <input name="position" id="career_position" placeholder="Senior Software Engineer" required>
          </div>
          <div>
            <label>Position Type</label>
            <select name="position_type" id="career_position_type">
              <option value="">Select position type</option>
              <option selected>Full-time</option>
              <option>Part-time</option>
              <option>Internship</option>
              <option>Remote</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label>Experience</label>
            <input name="experience" id="career_experience" placeholder="5+ years in Node.js & MySQL">
          </div>
          <div>
            <label>LinkedIn URL</label>
            <input name="linkedin" id="career_linkedin" placeholder="https://linkedin.com/in/applicant">
          </div>
        </div>

        <div>
          <label>GitHub URL</label>
          <input name="github" id="career_github" placeholder="https://github.com/applicant">
        </div>

        <input type="hidden" name="source" value="careers_portal">

        <div class="grid-2">
          <div>
            <label>Resume (PDF / DOC / DOCX) *</label>
            <input name="resume" id="career_resume" type="file" accept=".pdf,.doc,.docx" required>
          </div>
          <div>
            <label>Cover Letter (Optional)</label>
            <input name="cover_letter" type="file" accept=".pdf,.doc,.docx">
          </div>
        </div>

        <button type="submit">Apply Now</button>
      </form>
    </section>
  </main>

  <script src="/script.js"></script>
</body>
</html>
