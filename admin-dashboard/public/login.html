<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Access - Form Management Console</title>
  <link rel="stylesheet" href="/css/app.css?v=6">
  <script>
    (function(){var s=localStorage.getItem('admin_theme')||'system';var d=s==='dark'||(s==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d){document.documentElement.setAttribute('data-theme','dark');}else{document.documentElement.setAttribute('data-theme','light');}})();
  </script>
  <style>
    .auth-tabs {
      display: flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 12px;
      margin: 20px 0 24px;
      gap: 4px;
    }
    .auth-tab {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s;
    }
    .auth-tab.active {
      background: #ffffff;
      color: #245ff4;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .pwd-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .pwd-wrapper input {
      padding-right: 42px !important;
    }
    .pwd-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      padding: 4px;
      cursor: pointer;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }
    .pwd-toggle:hover {
      color: #334155;
    }
    .secret-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 12px;
      background: #fffbeb;
      border: 1px solid #fef3c7;
      color: #b45309;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .status-msg {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      margin-top: 12px;
      display: none;
    }
    .status-msg.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }
    .status-msg.success {
      display: block;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }
  </style>
</head>
<body class="login-page">
  <!-- Theme Toggle in Login Page -->
  <button type="button" id="loginThemeToggle" class="login-theme-btn" title="Toggle Light / Dark mode" aria-label="Toggle theme">
    <span id="themeToggleIcon">🌙</span>
    <span id="themeToggleText">Dark</span>
  </button>

  <main class="login-card">
    <div class="brand-mark">DB</div>
    <p class="eyebrow">FORM MANAGEMENT</p>
    <h1 id="pageTitle">Admin Sign In</h1>
    <p class="muted" id="pageSub">Authenticate to access database console & records.</p>

    <!-- Navigation Tabs -->
    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab active" id="tabSignIn">Sign In</button>
      <button type="button" class="auth-tab" id="tabRegister">Create Account</button>
    </div>

    <!-- Sign In Form -->
    <form id="loginForm">
      <label>Enter your email
        <input name="email" id="loginEmail" type="email" autocomplete="username" placeholder="Enter your email" required>
      </label>

      <label>Enter your password
        <div class="pwd-wrapper">
          <input name="password" id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter your password" required>
          <button type="button" class="pwd-toggle" data-target="loginPassword" aria-label="Toggle password visibility">
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-closed" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
              <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
              <line x1="2" y1="2" x2="22" y2="22"></line>
            </svg>
          </button>
        </div>
      </label>

      <div id="loginStatus" class="status-msg" role="alert"></div>
      <button class="btn primary full" type="submit" id="loginBtn">Sign in</button>
    </form>

    <!-- Create Account Form -->
    <form id="registerForm" style="display: none;">
      <label>Full Name
        <input name="name" id="regName" type="text" placeholder="Enter your full name" required>
      </label>

      <label>Enter your email
        <input name="email" id="regEmail" type="email" autocomplete="username" placeholder="Enter your email" required>
      </label>

      <label>Enter your password
        <div class="pwd-wrapper">
          <input name="password" id="regPassword" type="password" autocomplete="new-password" placeholder="Enter your password (min 6 chars)" minlength="6" required>
          <button type="button" class="pwd-toggle" data-target="regPassword" aria-label="Toggle password visibility">
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-closed" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
              <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
              <line x1="2" y1="2" x2="22" y2="22"></line>
            </svg>
          </button>
        </div>
      </label>

      <label>Admin Secret Key
        <div class="secret-badge">
          🛡️ Secret authorization key is required
        </div>
        <div class="pwd-wrapper">
          <input name="secret_key" id="regSecretKey" type="password" placeholder="Enter required admin secret key" required>
          <button type="button" class="pwd-toggle" data-target="regSecretKey" aria-label="Toggle secret key visibility">
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-closed" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
              <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
              <line x1="2" y1="2" x2="22" y2="22"></line>
            </svg>
          </button>
        </div>
      </label>

      <div id="regStatus" class="status-msg" role="alert"></div>
      <button class="btn primary full" type="submit" id="regBtn">Create Account & Enter</button>
    </form>

    <p class="tiny muted" style="margin-top: 24px;">Protected administrative environment · Secret key authorized</p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
