# ==============================================================================
# Nginx Configuration for Admin Dashboard Web Application (Port 8080)
# ==============================================================================
# - Serves static dashboard HTML, CSS, JavaScript, and asset files.
# - Functions as a reverse proxy for /api/ and /uploads/ back to the Node.js backend.
# - Applies hardened HTTP security headers and prevents unwanted browser caching.
# ==============================================================================

server {
    # Listen on port 80 inside the container (mapped to port 8080 on the host)
    listen 80;
    server_name _;

    # Web root where administrative UI static assets reside
    root /usr/share/nginx/html;
    index login.html;

    # Suppress Nginx version information from HTTP response headers for security
    server_tokens off;

    # Allow avatar image uploads up to 25MB (matches Node.js Multer 20MB limit)
    client_max_body_size 25m;

    # --------------------------------------------------------------------------
    # Global Security Headers
    # --------------------------------------------------------------------------
    # Prevent browsers from MIME-sniffing a response away from declared content-type
    add_header X-Content-Type-Options nosniff always;
    # Ensure referer information is sent only on HTTPS origins
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Prevent clickjacking by forbidding embedding inside external iframes
    add_header X-Frame-Options DENY always;

    # --------------------------------------------------------------------------
    # Health Probe Endpoint
    # --------------------------------------------------------------------------
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # --------------------------------------------------------------------------
    # Reverse Proxy: Administrative & System REST APIs
    # --------------------------------------------------------------------------
    # Using '^~' modifier ensures this prefix match takes precedence over static regex
    location ^~ /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;

        # Forward original client headers for accurate logging and IP-based rate limiting
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Network timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Reverse Proxy: Public Forms Portal Shortcut
    # --------------------------------------------------------------------------
    location /forms {
        proxy_pass http://backend:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --------------------------------------------------------------------------
    # Reverse Proxy: Uploaded Profile Avatars
    # --------------------------------------------------------------------------
    # Forward avatar image requests to backend static handler with ^~ precedence
    location ^~ /uploads/ {
        proxy_pass http://backend:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Static Assets & No-Cache Header
    # --------------------------------------------------------------------------
    # Disable aggressive client caching for rapid development & real-time updates
    location ~* \.(?:html|js|css|png|jpg|jpeg|gif|svg|ico|webp)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri $uri/ =404;
    }

    # Default fallback for all other requests
    location / {
        try_files $uri $uri/ =404;
    }
}
